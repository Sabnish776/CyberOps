version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devkit_backend
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/cyberops.db
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devkit_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_logs:
  backend_data:
