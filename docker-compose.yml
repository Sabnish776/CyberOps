version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberops_backend
    expose:
      - "8080"
    restart: unless-stopped
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/cyberops.db
      - JWT_SECRET=${JWT_SECRET:-S3cur3Cyb3rOpsJwTS3cr3tK3y2026!@#$}
      - APP_MASTER_KEY=${APP_MASTER_KEY:-CyberOpsMasterEncKey202632B!}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberops_frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_logs:
  backend_data:
